name: Pemeriksaan keamanan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  periksa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node periksa-keamanan.js
      - run: node tests/jalankan.js
