<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Pemantau Cookies</title>
  </head>
  <body>
    <header class="kepala">
      <h1>Pemantau Cookies</h1>
      <div class="bahasa" role="group" data-i18n-aria="bahasa.label">
        <button id="bahasa-id" data-bahasa="id" aria-pressed="true">ID</button>
        <button id="bahasa-en" data-bahasa="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <nav class="tab" role="tablist" data-i18n-aria="tab.aria">
      <button role="tab" id="tab-peringatan" data-panel="panel-peringatan" aria-selected="true"><span data-i18n="tab.peringatan"></span></button>
      <button role="tab" id="tab-pindai" data-panel="panel-pindai" aria-selected="false"><span data-i18n="tab.pindai"></span></button>
      <button role="tab" id="tab-ekstensi" data-panel="panel-ekstensi" aria-selected="false"><span data-i18n="tab.ekstensi"></span></button>
      <button role="tab" id="tab-bersih" data-panel="panel-bersih" aria-selected="false"><span data-i18n="tab.bersih"></span></button>
      <button role="tab" id="tab-pengaturan" data-panel="panel-pengaturan" aria-selected="false"><span data-i18n="tab.pengaturan"></span></button>
    </nav>

    <div class="panel" id="panel-peringatan" role="tabpanel" aria-labelledby="tab-peringatan">
    <section class="status">
      <h2 data-i18n="status.judul"></h2>
      <div id="barisStatus"></div>
    </section>

    <section>
      <h2 data-i18n="h.peringatan"></h2>
      <div id="peringatan"></div>
      <button id="bersihkanPeringatan" class="kecil" data-i18n="btn.bersihkan"></button>
    </section>

    <section class="tips">
      <strong data-i18n="tips.judul"></strong>
      <span data-i18n="tips.isi"></span>
    </section>
    </div>

    <div class="panel" id="panel-pindai" role="tabpanel" aria-labelledby="tab-pindai" hidden>
    <section>
      <h2 data-i18n="pindai.judul"></h2>
      <p class="info" data-i18n="pindai.info"></p>
      <button id="tombolPindai" data-i18n="pindai.tombol"></button>
      <div id="hasilPindai"></div>
    </section>

    </div>

    <div class="panel" id="panel-ekstensi" role="tabpanel" aria-labelledby="tab-ekstensi" hidden>
    <section>
      <h2 data-i18n="ekstensi.judul"></h2>
      <p class="info" data-i18n="ekstensi.info"></p>
      <div id="izinEkstensi"></div>
      <div id="daftarEkstensi"></div>
      <div id="daftarEkstensiTepercaya"></div>
    </section>

    </div>

    <div class="panel" id="panel-bersih" role="tabpanel" aria-labelledby="tab-bersih" hidden>
    <section>
      <h2 data-i18n="bersih.judul"></h2>
      <p class="info" data-i18n="bersih.info"></p>
      <div class="darurat">
        <button id="tombolDarurat" class="hapus" data-i18n="darurat.tombol"></button>
        <p class="info" data-i18n="darurat.info"></p>
      </div>
      <div id="tabIniBersih"></div>
      <h3 data-i18n="bersih.deteksiJudul"></h3>
      <div id="daftarDeteksi"></div>
      <h3 data-i18n="lindung.judul"></h3>
      <p class="info" data-i18n="lindung.info"></p>
      <div id="daftarLindungi"></div>
      <div id="statusBersih" class="info"></div>
      <div id="riwayatBersih" class="info"></div>
      <div class="baris">
        <button id="tombolBersihkanSekarang" class="kecil" data-i18n="bersih.sekarang"></button>
      </div>
      <div id="pesanBersih" class="info"></div>
    </section>
    </div>

    <div class="panel" id="panel-pengaturan" role="tabpanel" aria-labelledby="tab-pengaturan" hidden>
    <details>
      <summary data-i18n="set.putih"></summary>
      <p class="info" data-i18n="set.putih.info"></p>
      <div class="baris">
        <input id="inputSitus" type="text" data-i18n-placeholder="set.putih.input" />
        <button id="tombolTambah" data-i18n="btn.tambah"></button>
      </div>
      <div id="pesanDaftarPutih" class="info"></div>
      <div id="daftarPutih"></div>
    </details>
    </div>

    <script src="bahasa.js"></script>
    <script src="umum.js"></script>
    <script src="ekstensi.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
